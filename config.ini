; 更改之后托盘右键 -> 重新加载配置（或重启程序）

; 按住该键显示小窗
hotkey.hold=Alt
; 固定 / 取消固定(全局显示小窗)
hotkey.pin=Ctrl+Alt+O

; 小窗左上角坐标
x=2168
y=1128

; 小窗大小
width=360
height=280

; 放大倍数
zoom=1

; 开机自启：1 打开 / 0 关闭（默认关闭）
autostart=0

; 以下需配置有效区后启用

; 启用有效区：1 启用 / 0 关闭
valid=1
; 是否在屏幕上画出有效区边缘：1 显示 / 0 不显示
valid.outline=1


; 矩形区域：左上x,左上y;右下x,右下y(无需矩形可在valid前加';'注释)
valid.rect=180,160;1150,860

; 圆形：圆周上任意三点x1,y1;x2,y2;x3,y3(无需圆形可在valid前加';'注释)
valid.circle=1500,300;2100,650;1650,1050

; 有全屏程序（游戏、全屏视频等）时隐藏小窗（只在启用有效区时生效，默认开启）：1 隐藏 / 0 照常显示
fullscreen.hide=1
